name: Deploy GitHub Pages

on:
  push:
    branches: [landing]
    # A sync run that found no changes still commits its "last checked" stamp.
    # Those commits touch nothing the site renders, so they must not trigger a rebuild.
    paths-ignore:
      - "data/drop-sync-status.json"
      - "data/database-sync-status.json"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landing
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES_BASE_PATH: /Destiny_Guide
        run: pnpm build
      - name: Export static Pages artifact
        env:
          GITHUB_PAGES_BASE_PATH: /Destiny_Guide
        run: pnpm export:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
