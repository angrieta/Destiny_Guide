name: Sync Item Database

on:
  schedule:
    # GitHub Actions cron is always UTC and has no timezone key.
    # 15:05 UTC == 00:05 KST the following day.
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Drop tables and the item database both push to landing; keep them from racing.
concurrency:
  group: playpso-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landing

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Sync item database
        run: pnpm sync:database

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: item-database-failure
          path: sync-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/database-*.json data/database-sync-status.json

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          if git diff --cached --quiet -- data/database-1.json data/database-2.json data/database-3.json data/database-4.json data/database-5.json; then
            git commit -m "chore: record item database check [skip deploy]"
          else
            git commit -m "chore: sync PlayPSO item database"
          fi

          # The drop table job may have pushed while we were scraping.
          for attempt in 1 2 3; do
            if git push origin HEAD:landing; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing and retrying..."
            git pull --rebase origin landing
          done
          echo "::error::Could not push item database updates after 3 attempts."
          exit 1
